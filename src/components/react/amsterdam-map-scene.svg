<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Stylized Amsterdam map — representative view">
  <!-- C-05d: El-cizimi stilize Amsterdam sahnesi (lisans-temiz, dis istek yok).
       Katmanlar: zemin > IJ nehri > kanal halkalari (Grachtengordel) > Amstel >
       bloklar > yollar > ZE poligonu > rota > arac.
       #routePath = animasyon yolu (offset-path icin); #vehicle + #zePoly mevcut
       CSS keyframe'lere baglanir. Renkler CSS degiskenine cevrilebilir. -->

  <!-- 1. ZEMIN -->
  <rect width="400" height="300" fill="#0D1427"/>

  <!-- 2. IJ NEHRI (ust yatay su bandi — Amsterdam imzasi #1) -->
  <path d="M0,28 C60,20 120,38 200,30 C280,22 340,40 400,32 L400,74 C330,84 260,66 190,74 C120,82 60,66 0,72 Z"
        fill="#16233F"/>
  <text x="316" y="52" fill="#3B5378" font-size="9" font-family="sans-serif" font-style="italic">Het IJ</text>

  <!-- 3. GRACHTENGORDEL — kanal yarim-halkalari (imza #2) -->
  <g stroke="#22365C" stroke-width="2.2" fill="none" opacity="0.9">
    <path d="M118,76 A86,86 0 0,0 284,80"/>
    <path d="M132,76 A70,70 0 0,0 270,79"/>
    <path d="M147,76 A54,54 0 0,0 255,78"/>
    <path d="M162,76 A38,38 0 0,0 240,77"/>
  </g>

  <!-- 4. AMSTEL nehri (imza #3 — merkezden guneye kivrim) -->
  <path d="M203,162 C210,190 196,214 206,240 C214,262 204,282 210,300"
        stroke="#22365C" stroke-width="4" fill="none" opacity="0.9"/>

  <!-- 5. SEHIR BLOKLARI (duzensiz) -->
  <g fill="#FFFFFF" opacity="0.05">
    <rect x="36" y="96" width="26" height="14" rx="3"/>
    <rect x="70" y="118" width="18" height="22" rx="3"/>
    <rect x="42" y="150" width="30" height="16" rx="3"/>
    <rect x="88" y="170" width="22" height="14" rx="3"/>
    <rect x="52" y="206" width="26" height="18" rx="3"/>
    <rect x="104" y="224" width="30" height="14" rx="3"/>
    <rect x="150" y="238" width="20" height="16" rx="3"/>
    <rect x="252" y="216" width="26" height="16" rx="3"/>
    <rect x="292" y="188" width="20" height="14" rx="3"/>
    <rect x="308" y="140" width="28" height="16" rx="3"/>
    <rect x="330" y="102" width="22" height="14" rx="3"/>
    <rect x="248" y="252" width="24" height="14" rx="3"/>
    <rect x="318" y="236" width="26" height="14" rx="3"/>
    <rect x="140" y="120" width="14" height="10" rx="2"/>
    <rect x="246" y="122" width="14" height="10" rx="2"/>
  </g>

  <!-- 6. YOLLAR: A10 ring hissi (genis yay) + radyal arter -->
  <path id="ringRoad" d="M18,262 C80,208 90,150 96,96 M96,96 C160,250 260,262 384,246"
        stroke="#1C2A47" stroke-width="5" fill="none" opacity="0"/>
  <path d="M8,238 C90,232 150,240 214,232 C286,222 338,196 380,150"
        stroke="#243756" stroke-width="4.5" fill="none"/>
  <path d="M8,238 C90,232 150,240 214,232 C286,222 338,196 380,150"
        stroke="#3A557F" stroke-width="1.2" fill="none" stroke-dasharray="6 8" opacity="0.6"/>
  <path d="M214,232 C216,206 210,186 205,164" stroke="#243756" stroke-width="3" fill="none"/>

  <!-- 7. ZE POLIGONU — Centrum (kanal halkasinin ici) -->
  <path id="zePoly"
        d="M150,80 L252,82 L266,108 L246,148 L196,160 L152,140 L140,106 Z"
        fill="#10B981" fill-opacity="0.10" stroke="#10B981" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="168" y="118" fill="#10B981" font-size="9" font-family="sans-serif" font-weight="600">Amsterdam ZE</text>

  <!-- 8. ROTA: arterden gelip radyal yola sapip poligona girer (yol geometrisini izler) -->
  <path id="routePath"
        d="M8,238 C90,232 150,240 214,232 C216,206 210,186 205,164 C202,152 200,142 198,132"
        fill="none" stroke="none"/>
  <!-- gorunur rota: poligon disi turuncu, ici emerald -->
  <path d="M8,238 C90,232 150,240 214,232 C216,206 211,190 207,172"
        stroke="#FF5722" stroke-width="1.8" fill="none" stroke-dasharray="5 4" opacity="0.9"/>
  <path d="M207,172 C204,158 201,144 198,132"
        stroke="#10B981" stroke-width="1.8" fill="none" stroke-dasharray="5 4" opacity="0.9"/>

  <!-- 9. ARAC (animasyon hedefi: offset-path: path('#routePath deger')) -->
  <g id="vehicle" transform="translate(207,172)">
    <circle r="6" fill="#10B981" opacity="0.28"/>
    <circle r="3" fill="#10B981"/>
  </g>
</svg>
